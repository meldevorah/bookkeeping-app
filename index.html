<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>简单记账</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f8f9fa;
            padding-bottom: 80px;
            color: #333;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .header h1 {
            font-size: 20px;
            margin-bottom: 15px;
        }
        
        .stats {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }
        
        .stat-item {
            flex: 1;
            text-align: center;
        }
        
        .stat-label {
            font-size: 12px;
            opacity: 0.9;
            margin-bottom: 5px;
        }
        
        .stat-value {
            font-size: 18px;
            font-weight: bold;
        }
        
        .fab {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            font-size: 28px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
            z-index: 1000;
            transition: transform 0.3s;
        }
        
        .fab:active {
            transform: scale(0.9);
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 2000;
        }
        
        .modal.active {
            display: flex;
            align-items: flex-end;
        }
        
        .modal-content {
            background: white;
            width: 100%;
            max-height: 90vh;
            border-radius: 20px 20px 0 0;
            padding: 20px;
            overflow-y: auto;
            animation: slideUp 0.3s;
        }
        
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }
        
        .modal-header h2 {
            font-size: 18px;
        }
        
        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            color: #999;
            cursor: pointer;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #666;
            font-size: 14px;
        }
        
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            background: #f8f9fa;
        }
        
        .tab-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .tab-btn {
            flex: 1;
            padding: 10px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }
        
        .tab-btn.active {
            background: #667eea;
            color: white;
        }
        
        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        
        .records-section {
            padding: 15px;
        }
        
        .section-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        
        .record-item {
            background: white;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        
        .record-amount {
            font-size: 18px;
            font-weight: bold;
        }
        
        .record-amount.income { color: #4CAF50; }
        .record-amount.expense { color: #f44336; }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }
        
        .export-btn {
            position: fixed;
            bottom: 20px;
            left: 20px;
            padding: 10px 15px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>💰 简单记账</h1>
        <div class="stats">
            <div class="stat-item">
                <div class="stat-label">收入</div>
                <div class="stat-value" id="totalIncome">¥0.00</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">支出</div>
                <div class="stat-value" id="totalExpense">¥0.00</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">结余</div>
                <div class="stat-value" id="balance">¥0.00</div>
            </div>
        </div>
    </div>
    
    <div class="records-section">
        <h2 class="section-title">最近记录</h2>
        <div id="recordsList"></div>
    </div>
    
    <button class="fab" onclick="openModal()">+</button>
    <button class="export-btn" onclick="exportData()">📥 备份</button>
    
    <div class="modal" id="addModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>添加记录</h2>
                <button class="close-btn" onclick="closeModal()">×</button>
            </div>
            
            <div class="tab-group">
                <button class="tab-btn active" onclick="switchTab('text')">快捷输入</button>
                <button class="tab-btn" onclick="switchTab('manual')">手动输入</button>
            </div>
            
            <div id="textTab">
                <div style="background: #f8f9fa; padding: 15px; border-radius: 12px; margin-bottom: 15px;">
                    <p style="font-size: 13px; color: #999; line-height: 1.6;">
                        午餐 35<br>
                        打车 28<br>
                        工资 8000<br>
                        7月1日 咖啡 32
                    </p>
                </div>
                <div class="form-group">
                    <textarea id="textInput" placeholder="输入内容" style="min-height: 80px;"></textarea>
                </div>
                <button class="submit-btn" onclick="parseText()">添加</button>
            </div>
            
            <div id="manualTab" style="display:none;">
                <div class="form-group">
                    <input type="date" id="date" value="">
                </div>
                <div class="form-group">
                    <select id="type">
                        <option value="expense">支出</option>
                        <option value="income">收入</option>
                    </select>
                </div>
                <div class="form-group">
                    <select id="category">
                        <option value="餐饮">🍚 餐饮</option>
                        <option value="交通">🚗 交通</option>
                        <option value="购物">🛒 购物</option>
                        <option value="娱乐">🎮 娱乐</option>
                        <option value="生活">🏠 生活</option>
                        <option value="医疗">💊 医疗</option>
                        <option value="工资">💰 工资</option>
                        <option value="其他">📌 其他</option>
                    </select>
                </div>
                <div class="form-group">
                    <input type="number" id="amount" placeholder="金额" step="0.01" min="0">
                </div>
                <div class="form-group">
                    <input type="text" id="description" placeholder="描述（可选）">
                </div>
                <button class="submit-btn" onclick="addManual()">添加</button>
            </div>
        </div>
    </div>
    
    <script>
        // 数据存储在 localStorage
        const STORAGE_KEY = 'bookkeeping_records';
        
        function loadRecords() {
            const data = localStorage.getItem(STORAGE_KEY);
            return data ? JSON.parse(data) : [];
        }
        
        function saveRecords(records) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
        }
        
        function parseTextInput(text) {
            const amountMatch = text.match(/(\d+\.?\d*)/);
            if (!amountMatch) return null;
            
            const amount = parseFloat(amountMatch[1]);
            const incomeKeywords = ['工资', '收入', '奖金', '报销', '退款', '兼职'];
            const type = incomeKeywords.some(kw => text.includes(kw)) ? 'income' : 'expense';
            
            const categories = {
                '餐饮': ['午餐', '晚餐', '早餐', '外卖', '餐厅', '咖啡', '奶茶'],
                '交通': ['打车', '地铁', '公交', '加油', '停车'],
                '购物': ['淘宝', '京东', '网购', '买'],
                '娱乐': ['电影', '游戏', '音乐', '视频'],
                '生活': ['水电', '物业', '话费', '网费'],
                '医疗': ['药店', '医院', '体检'],
            };
            
            let category = '其他';
            for (const [cat, keywords] of Object.entries(categories)) {
                if (keywords.some(kw => text.includes(kw))) {
                    category = cat;
                    break;
                }
            }
            
            const dateMatch = text.match(/(\d+)月(\d+)日/);
            let date;
            if (dateMatch) {
                const [, month, day] = dateMatch;
                date = `${new Date().getFullYear()}-${month.padStart(2, '0')}-${day.padStart(2, '0')}`;
            } else {
                date = new Date().toISOString().split('T')[0];
            }
            
            return { date, type, category, amount, description: text };
        }
        
        function addRecord(record) {
            const records = loadRecords();
            record.id = Date.now();
            record.created_at = new Date().toISOString();
            records.push(record);
            saveRecords(records);
            loadData();
            closeModal();
        }
        
        function loadData() {
            const records = loadRecords();
            
            const summary = {
                income: records.filter(r => r.type === 'income').reduce((sum, r) => sum + r.amount, 0),
                expense: records.filter(r => r.type === 'expense').reduce((sum, r) => sum + r.amount, 0),
            };
            summary.balance = summary.income - summary.expense;
            
            updateStats(summary);
            updateRecords(records.slice(-50).reverse());
        }
        
        function updateStats(summary) {
            document.getElementById('totalIncome').textContent = '¥' + summary.income.toFixed(2);
            document.getElementById('totalExpense').textContent = '¥' + summary.expense.toFixed(2);
            
            const balanceEl = document.getElementById('balance');
            balanceEl.textContent = '¥' + summary.balance.toFixed(2);
            balanceEl.style.color = summary.balance < 0 ? '#f44336' : 'white';
        }
        
        function updateRecords(records) {
            const container = document.getElementById('recordsList');
            
            if (records.length === 0) {
                container.innerHTML = '<div class="empty-state"><p>暂无记录</p></div>';
                return;
            }
            
            container.innerHTML = records.map(record => `
                <div class="record-item">
                    <div>
                        <div style="font-size: 14px; color: #666;">${record.category}</div>
                        <div style="font-size: 12px; color: #999;">${record.description || ''}</div>
                    </div>
                    <div style="text-align: right;">
                        <div class="record-amount ${record.type}">
                            ${record.type === 'income' ? '+' : '-'}¥${record.amount.toFixed(2)}
                        </div>
                        <div style="font-size: 12px; color: #999;">${record.date}</div>
                    </div>
                </div>
            `).join('');
        }
        
        function openModal() {
            document.getElementById('addModal').classList.add('active');
        }
        
        function closeModal() {
            document.getElementById('addModal').classList.remove('active');
            document.getElementById('textInput').value = '';
            document.getElementById('amount').value = '';
            document.getElementById('description').value = '';
        }
        
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            if (tab === 'text') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('textTab').style.display = 'block';
                document.getElementById('manualTab').style.display = 'none';
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('textTab').style.display = 'none';
                document.getElementById('manualTab').style.display = 'block';
            }
        }
        
        function parseText() {
            const text = document.getElementById('textInput').value;
            if (!text) return alert('请输入内容');
            
            const record = parseTextInput(text);
            if (record) {
                addRecord(record);
            } else {
                alert('无法解析');
            }
        }
        
        function addManual() {
            const amount = document.getElementById('amount').value;
            if (!amount || amount <= 0) return alert('请输入有效金额');
            
            addRecord({
                date: document.getElementById('date').value,
                type: document.getElementById('type').value,
                category: document.getElementById('category').value,
                amount: parseFloat(amount),
                description: document.getElementById('description').value
            });
        }
        
        function exportData() {
            const records = loadRecords();
            const blob = new Blob([JSON.stringify(records, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `bookkeeping_${new Date().getTime()}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }
        
        // 初始化
        document.getElementById('date').valueAsDate = new Date();
        loadData();
    </script>
</body>
</html>
